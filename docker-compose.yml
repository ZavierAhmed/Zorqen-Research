services:
  postgres:
    image: postgres:16-alpine
    container_name: zorqen-research-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zorqen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zorqen}
      POSTGRES_DB: ${POSTGRES_DB:-zorqen_research}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zorqen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zorqen} -d ${POSTGRES_DB:-zorqen_research}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: zorqen-research-migrate
    environment:
      ZORQEN_ENVIRONMENT: development
      ZORQEN_LOG_LEVEL: INFO
      ZORQEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_ARTIFACT_ROOT: /app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: zorqen-research-api
    environment:
      ZORQEN_ENVIRONMENT: development
      ZORQEN_LOG_LEVEL: INFO
      ZORQEN_API_HOST: 0.0.0.0
      ZORQEN_API_PORT: 8000
      ZORQEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_ARTIFACT_ROOT: /app/artifacts
      ZORQEN_WORKER_IDLE_INTERVAL_SECONDS: "5"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - zorqen_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: zorqen-research-worker
    environment:
      ZORQEN_ENVIRONMENT: development
      ZORQEN_LOG_LEVEL: INFO
      ZORQEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_ARTIFACT_ROOT: /app/artifacts
      ZORQEN_WORKER_IDLE_INTERVAL_SECONDS: "5"
    volumes:
      - zorqen_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Explicit fixture publication only. Not started by `docker compose up`.
  # Example:
  #   docker compose --profile fixture run --rm dataset-fixture
  dataset-fixture:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: zorqen-research-dataset-fixture
    environment:
      ZORQEN_ENVIRONMENT: development
      ZORQEN_LOG_LEVEL: INFO
      ZORQEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_ARTIFACT_ROOT: /app/artifacts
    volumes:
      - zorqen_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["fixture"]
    command: ["uv", "run", "zorqen-dataset", "publish-fixture"]

  # Explicit Binance public-data import only. Never started by `docker compose up`.
  # Example:
  #   docker compose --profile binance-import run --rm binance-import \
  #     import-binance-klines --symbol BTCUSDT --timeframe 1h \
  #     --start 2026-06-01T00:00:00Z --end 2026-06-01T05:00:00Z
  binance-import:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: zorqen-research-binance-import
    environment:
      ZORQEN_ENVIRONMENT: development
      ZORQEN_LOG_LEVEL: INFO
      ZORQEN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-zorqen}:${POSTGRES_PASSWORD:-zorqen}@postgres:5432/${POSTGRES_DB:-zorqen_research}
      ZORQEN_ARTIFACT_ROOT: /app/artifacts
      ZORQEN_IMPORT_MAX_CANDLES: ${ZORQEN_IMPORT_MAX_CANDLES:-100000}
    volumes:
      - zorqen_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["binance-import"]
    entrypoint: ["uv", "run", "zorqen-dataset"]
    command: ["--help"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Intentionally no VITE_API_BASE_URL build arg.
      # The Dockerfile default is empty so the bundle uses same-origin /api
      # (proxied by nginx to the api service). Do not pass a Compose/runtime
      # environment value expecting it to change a compiled Vite bundle.
      # Intentional override example:
      #   docker compose build --build-arg VITE_API_BASE_URL=https://api.example.com frontend
    container_name: zorqen-research-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  zorqen_pgdata:
  zorqen_artifacts:
