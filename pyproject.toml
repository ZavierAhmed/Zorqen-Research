[project]
name = "zorqen-research"
version = "0.1.0"
description = "Zorqen Research — autonomous strategy research and qualification platform foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
zorqen-api = "zorqen_research.api.app:run"
zorqen-worker = "zorqen_research.worker.__main__:main"
zorqen-dataset = "zorqen_research.datasets.cli:main"
zorqen-backtest = "zorqen_research.backtesting.cli:main"
zorqen-strategy = "zorqen_research.strategies.cli:main"
zorqen-timeframes = "zorqen_research.timeframes.cli:main"
zorqen-indicators = "zorqen_research.indicators.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zorqen_research"]

[tool.hatch.build.targets.wheel.force-include]
"src/zorqen_research/datasets/fixtures/btcusdt_1h_fixture.csv" = "zorqen_research/datasets/fixtures/btcusdt_1h_fixture.csv"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require a live PostgreSQL instance",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["zorqen_research"]
