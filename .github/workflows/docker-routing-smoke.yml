# Docker Compose routing smoke: frontend/nginx same-origin /api -> API + registry.
name: Docker Routing Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-routing-smoke:
    name: Frontend-to-API routing via nginx
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build API, migrate, and frontend images
        run: docker compose build api migrate frontend

      - name: Start postgres, migrate, api, and frontend
        run: docker compose up -d postgres migrate api frontend

      - name: Wait for frontend origin readiness through nginx
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/api/v1/health/ready >/tmp/ready.json; then
              python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/ready.json"))
          assert payload["status"] == "ready", payload
          assert payload["components"]["database"]["status"] == "healthy", payload
          print("nginx -> api readiness ok")
          PY
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for readiness via frontend origin" >&2
          exit 1

      - name: Verify liveness via frontend origin
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:5173/ >/dev/null
          curl -sf http://127.0.0.1:5173/api/v1/health/live | tee /tmp/live.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/live.json"))
          assert payload["status"] == "healthy", payload
          print("nginx -> api liveness ok")
          PY

      - name: Verify strategy-family registry via frontend origin
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:5173/api/v1/strategy-families | tee /tmp/families.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/families.json"))
          items = payload["items"]
          assert payload["count"] == 2, payload
          assert len(items) == 2, payload
          assert [item["code"] for item in items] == [
              "adaptive_mtf_trend_breakout",
              "support_resistance",
          ], payload
          assert items[0]["research_priority"] == "primary", payload
          assert items[1]["research_priority"] == "secondary", payload
          assert all(item["status"] == "active" for item in items), payload
          print("nginx -> strategy-families registry ok")
          PY

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color postgres migrate api frontend

      - name: Clean up
        if: always()
        run: docker compose down -v
