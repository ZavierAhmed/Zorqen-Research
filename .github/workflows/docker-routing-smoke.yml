# Docker Compose routing smoke: frontend/nginx same-origin /api -> API + registry + datasets.
name: Docker Routing Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-routing-smoke:
    name: Frontend-to-API routing via nginx
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build API, worker, migrate, frontend, and dataset-fixture images
        run: |
          docker compose --profile fixture build \
            api worker migrate frontend dataset-fixture

      - name: Start postgres, migrate, api, worker, and frontend
        run: docker compose up -d postgres migrate api worker frontend

      - name: Wait for frontend origin readiness through nginx
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/api/v1/health/ready >/tmp/ready.json; then
              python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/ready.json"))
          assert payload["status"] == "ready", payload
          assert payload["components"]["database"]["status"] == "healthy", payload
          print("nginx -> api readiness ok")
          PY
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for readiness via frontend origin" >&2
          exit 1

      - name: Verify liveness via frontend origin
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:5173/ >/dev/null
          curl -sf http://127.0.0.1:5173/api/v1/health/live | tee /tmp/live.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/live.json"))
          assert payload["status"] == "healthy", payload
          print("nginx -> api liveness ok")
          PY

      - name: Verify strategy-family registry via frontend origin
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:5173/api/v1/strategy-families | tee /tmp/families.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/families.json"))
          items = payload["items"]
          assert payload["count"] == 2, payload
          assert len(items) == 2, payload
          assert [item["code"] for item in items] == [
              "adaptive_mtf_trend_breakout",
              "support_resistance",
          ], payload
          assert items[0]["research_priority"] == "primary", payload
          assert items[1]["research_priority"] == "secondary", payload
          assert all(item["status"] == "active" for item in items), payload
          print("nginx -> strategy-families registry ok")
          PY

      - name: Publish deterministic dataset fixture
        run: |
          set -euo pipefail
          docker compose --profile fixture run \
            --rm \
            --no-deps \
            -T \
            dataset-fixture | tee /tmp/fixture-output.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          EXPECTED_HASH = "5a0f0d0aacc3bc06969c4d45a38906a8d8a423ab449178b22fbf6a8abe81df80"
          lines = [
              line.strip()
              for line in Path("/tmp/fixture-output.log").read_text().splitlines()
              if line.strip()
          ]
          payload = None
          for line in reversed(lines):
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict) and candidate.get("ok") is True:
                  payload = candidate
                  break
          assert payload is not None, {
              "error": "No valid fixture result JSON was found",
              "output": lines,
          }
          assert payload["created"] is True, payload
          assert payload["partition_count"] == 1, payload
          assert payload["total_rows"] == 5, payload
          assert payload["manifest_hash"] == EXPECTED_HASH, payload
          Path("/tmp/snapshot_id.txt").write_text(payload["snapshot_id"])
          Path("/tmp/fixture_hash.txt").write_text(payload["manifest_hash"])
          print(
              "fixture publication ok",
              payload["snapshot_id"],
              payload["manifest_hash"],
          )
          PY

      - name: Verify datasets API via frontend origin
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:5173/api/v1/datasets | tee /tmp/datasets.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          EXPECTED_HASH = "5a0f0d0aacc3bc06969c4d45a38906a8d8a423ab449178b22fbf6a8abe81df80"
          payload = json.load(open("/tmp/datasets.json"))
          assert payload["count"] == 1, payload
          assert len(payload["items"]) == 1, payload
          item = payload["items"][0]
          assert item["name"] == "fixture_binance_futures_btcusdt_1h", item
          assert item["status"] == "published", item
          assert item["exchange"] == "binance_futures", item
          fixture_hash = Path("/tmp/fixture_hash.txt").read_text().strip()
          assert fixture_hash == EXPECTED_HASH, fixture_hash
          assert item["content_hash"] == fixture_hash, (item["content_hash"], fixture_hash)
          text = json.dumps(payload)
          assert re.search(r"[A-Za-z]:\\\\|/[Hh]ome/|/[Uu]sers/|/app/artifacts", text) is None, text
          open("/tmp/snapshot_id.txt", "w").write(item["id"])
          open("/tmp/content_hash.txt", "w").write(item["content_hash"])
          print("nginx -> datasets list ok")
          PY
          SNAPSHOT_ID="$(cat /tmp/snapshot_id.txt)"
          CONTENT_HASH="$(cat /tmp/content_hash.txt)"
          curl -sf "http://127.0.0.1:5173/api/v1/datasets/${SNAPSHOT_ID}" | tee /tmp/dataset_detail.json
          curl -sf "http://127.0.0.1:5173/api/v1/datasets/${SNAPSHOT_ID}/manifest" | tee /tmp/dataset_manifest.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          detail = json.load(open("/tmp/dataset_detail.json"))
          manifest = json.load(open("/tmp/dataset_manifest.json"))
          content_hash = open("/tmp/content_hash.txt").read().strip()
          fixture_hash = Path("/tmp/fixture_hash.txt").read_text().strip()
          assert detail["content_hash"] == content_hash == fixture_hash, (
              detail["content_hash"],
              content_hash,
              fixture_hash,
          )
          assert manifest["content_hash"] == content_hash, (manifest, content_hash)
          assert len(detail["partitions"]) == 1, detail
          assert detail["partitions"][0]["symbol"] == "BTCUSDT", detail
          assert detail["partitions"][0]["timeframe"] == "1h", detail
          text = json.dumps({"detail": detail, "manifest": manifest})
          assert re.search(r"[A-Za-z]:\\\\|/[Hh]ome/|/[Uu]sers/|/app/artifacts", text) is None, text
          print("nginx -> dataset detail/manifest ok")
          PY

      - name: Print service logs on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "===== fixture-output.log ====="
          if [ -f /tmp/fixture-output.log ]; then
            cat /tmp/fixture-output.log
          else
            echo "(missing /tmp/fixture-output.log)"
          fi
          echo "===== compose service logs ====="
          docker compose logs --no-color postgres migrate api worker frontend

      - name: Clean up
        if: always()
        run: docker compose down -v
